name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [ccr-af98140c-ehb7ud]
    paths: ['apps/mobile/**', 'packages/shared/**', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Test shared package
        working-directory: packages/shared
        run: dart pub get && dart test
      - name: Build release APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: phone2pc-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
